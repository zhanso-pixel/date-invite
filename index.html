<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A little question…</title>
<style>
  :root{
    --bg1:#ffd1e8; --bg2:#ff9ec4; --bg3:#c89bff;
    --ink:#3a2b3f; --card:#ffffff; --accent:#ff3d7f; --accent2:#7a5cff;
    --shadow:0 18px 40px rgba(180,50,110,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); overflow:hidden; overflow-x:hidden;
    min-height:100vh; min-height:100dvh; padding:12px;
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    background-size:200% 200%; animation:flow 14s ease infinite;
    display:flex; align-items:center; justify-content:center;
  }
  @keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  .stage{ width:100%; max-width:540px; padding:4px; }

  /* floating hearts background */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts span{position:absolute;bottom:-40px;font-size:22px;opacity:.5;animation:rise linear infinite}
  @keyframes rise{to{transform:translateY(-115vh) rotate(360deg);opacity:0}}

  .screen{
    position:relative; z-index:1;
    background:var(--card); border-radius:28px; padding:30px 24px 34px;
    box-shadow:var(--shadow); text-align:center;
    display:none; animation:pop .45s cubic-bezier(.2,.9,.25,1.3);
    max-height:calc(100dvh - 24px); overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .screen.active{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

  h1{font-size:clamp(24px,6vw,34px); margin:6px 0 4px; line-height:1.15}
  .sub{color:#8a7d8f; font-size:15px; margin:0 0 22px}
  .emoji-big{font-size:54px; display:block; margin-bottom:6px}

  .btn{
    border:none; cursor:pointer; font-size:18px; font-weight:700; color:#fff;
    padding:15px 30px; border-radius:999px; transition:transform .12s, box-shadow .2s, background .2s;
    box-shadow:0 8px 18px rgba(255,61,127,.35);
  }
  .btn:active{transform:scale(.96)}
  .btn-yes{background:linear-gradient(135deg,#ff5fa2,#ff3d7f)}
  .btn-no{background:linear-gradient(135deg,#b9a9c9,#9b8aad); box-shadow:0 6px 14px rgba(0,0,0,.15)}

  .row{display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; position:relative; min-height:64px}

  /* No button that can teleport (desktop) */
  #noBtn.flee{position:fixed; z-index:5; transition:left .18s ease, top .18s ease}

  /* food + chip grid */
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:8px 0 22px}
  @media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{
    background:#fff7fb; border:2px solid #ffe1ee; border-radius:18px; padding:14px 6px;
    cursor:pointer; transition:transform .12s, border-color .2s, background .2s; user-select:none;
  }
  .card .ic{font-size:30px; display:block}
  .card .lb{font-size:13px; margin-top:6px; color:#6c5f72; font-weight:600}
  .card:active{transform:scale(.95)}
  .card.sel{border-color:var(--accent); background:#ffe8f1; transform:translateY(-2px)}

  /* calendar */
  .cal-head{display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; margin-bottom:10px; font-size:18px}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; font-size:12px; color:#a596ab; margin-bottom:6px}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .day{padding:10px 0; border-radius:12px; cursor:pointer; font-weight:600; background:#faf4f9; transition:.15s; user-select:none}
  .day.empty{background:transparent; cursor:default}
  .day.off{opacity:.3; cursor:not-allowed; text-decoration:line-through}
  .day:not(.off):not(.empty):active{transform:scale(.92)}
  .day.sel{background:var(--accent); color:#fff}

  .chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:14px 0 4px}
  .chip{
    padding:10px 16px; border-radius:999px; background:#f4eefb; border:2px solid #eaddfb;
    cursor:pointer; font-weight:600; font-size:14px; transition:.15s; user-select:none;
  }
  .chip.sel{background:var(--accent2); color:#fff; border-color:var(--accent2)}

  input[type=text]{
    width:100%; padding:14px 16px; border-radius:14px; border:2px solid #eaddfb;
    font-size:16px; outline:none; transition:.2s;
  }
  input[type=text]:focus{border-color:var(--accent2)}

  .next{margin-top:22px}
  .next .btn{background:linear-gradient(135deg,#8a6cff,#6f3dff); box-shadow:0 8px 18px rgba(111,61,255,.35)}
  .next .btn:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.3)}

  .summary{text-align:left; background:#fff7fb; border-radius:16px; padding:16px 18px; margin:18px 0 4px}
  .summary div{padding:7px 0; border-bottom:1px dashed #ffd9e9; font-size:15px}
  .summary div:last-child{border:none}
  .summary b{color:var(--accent)}
  .status{font-size:13px; color:#a596ab; margin-top:14px; min-height:18px}

  .back{position:absolute; left:18px; top:18px; background:none; border:none; font-size:22px; cursor:pointer; color:#caa9bd}

  #muteBtn{position:fixed; top:14px; right:14px; z-index:20; width:52px; height:52px; border-radius:50%;
    border:2px solid #ffd1e8; cursor:pointer; font-size:24px; background:rgba(255,255,255,.92); backdrop-filter:blur(6px);
    box-shadow:0 6px 16px rgba(180,50,110,.3); transition:transform .12s}
  #muteBtn:active{transform:scale(.9)}
  #muteBtn.hint{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(255,61,127,.35)}50%{box-shadow:0 6px 26px rgba(255,61,127,.85), 0 0 0 8px rgba(255,61,127,.12)}}
  #mstat{position:fixed; top:70px; right:14px; z-index:20; font-size:11px; color:#7a5cff; background:rgba(255,255,255,.8);
    padding:3px 8px; border-radius:8px; max-width:160px; text-align:right; min-height:0}
  #mstat:empty{display:none}

  /* ---------- phones ---------- */
  @media(max-width:480px){
    .screen{padding:24px 16px 26px; border-radius:22px}
    h1{font-size:22px}
    .sub{font-size:13.5px; margin-bottom:18px}
    .emoji-big{font-size:46px}
    .btn{font-size:17px; padding:14px 24px}
    .grid{gap:10px; margin:6px 0 18px}
    .card{padding:12px 4px; border-radius:15px}
    .card .ic{font-size:27px}
    .card .lb{font-size:12px}
    .day{padding:11px 0; border-radius:10px}
    .chip{padding:11px 15px; font-size:14px}
    .back{font-size:24px; left:14px; top:14px; padding:4px}
    #muteBtn{width:46px; height:46px; font-size:21px; top:10px; right:10px}
    #mstat{top:60px; right:10px; font-size:10px; max-width:130px}
  }
  @media(max-width:360px){
    .grid{grid-template-columns:repeat(2,1fr)}
    h1{font-size:20px}
    .day{padding:9px 0; font-size:14px}
  }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<button id="muteBtn" class="hint" title="Music on/off — tap to mute" aria-label="Music">🔊</button>
<div id="mstat"></div>

<div class="stage">

  <!-- SCREEN 1: THE ASK -->
  <section class="screen active" id="s1">
    <span class="emoji-big" id="askEmoji">🥺</span>
    <h1 id="askTitle">Will you go on a date with me?</h1>
    <p class="sub">Take your time… (but choose wisely 💕)</p>
    <div class="row" id="askRow">
      <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
  </section>

  <!-- SCREEN 2: FOOD -->
  <section class="screen" id="s2">
    <h1>Yay! 🥰 What should we eat?</h1>
    <p class="sub">Pick your favorite 🍜</p>
    <div class="grid" id="foodGrid"></div>
    <div class="next"><button class="btn" id="foodNext" disabled>Next →</button></div>
  </section>

  <!-- SCREEN 3: DATE & TIME -->
  <section class="screen" id="s3">
    <button class="back" data-go="s2">←</button>
    <h1>When works for you?</h1>
    <p class="sub">Pick a day & a time</p>
    <div class="cal-head" id="calHead">June 2026</div>
    <div class="dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
    <div class="days" id="days"></div>
    <div class="chips" id="timeChips"></div>
    <div class="next"><button class="btn" id="timeNext" disabled>Next →</button></div>
  </section>

  <!-- SCREEN 4: PLACE -->
  <section class="screen" id="s4">
    <button class="back" data-go="s3">←</button>
    <h1>Where to? 📍</h1>
    <p class="sub">Pick a spot 💕</p>
    <div class="chips" id="placeChips"></div>
    <input type="text" id="placeInput" placeholder="or type your own…" autocomplete="off" />
    <div class="next"><button class="btn" id="placeNext" disabled>It's a date →</button></div>
  </section>

  <!-- SCREEN 5: CONFIRM -->
  <section class="screen" id="s5">
    <span class="emoji-big">🎉</span>
    <h1>It's a date!</h1>
    <p class="sub">I'll be there at that moment. ❤️</p>
    <div class="summary" id="summary"></div>
    <div class="status" id="status"></div>
  </section>

</div>

<script>
/* ============================================================
   CONFIG — edit these two lines
   ============================================================ */
const CONFIG = {
  yourName: "Zhanserik",          // <-- put YOUR name (shown in the final message)
  sheetUrl: "https://script.google.com/macros/s/AKfycbyHfoUEBTtnfKwMbEvsOu1aG33cE-598oOZ_wsEjoClHjOefJI1H7aq6gUdVIwczjc/exec",                   // <-- paste your Google Apps Script Web App URL here (see SETUP.md). Leave "" to skip saving.
  musicFile: "song.mp3"           // <-- put a song.mp3 next to index.html to play the real song; if missing, a soft synth melody plays instead.
};

/* ============================================================ */
const state = { food:null, dateLabel:null, time:null, place:null };
const $ = s => document.querySelector(s);

/* ---- floating hearts ---- */
(function hearts(){
  const box = $("#hearts"), set = ["💕","💖","💗","🌸","✨","💞"];
  for(let i=0;i<16;i++){
    const h=document.createElement("span");
    h.textContent=set[i%set.length];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=(14+Math.random()*22)+"px";
    h.style.animationDuration=(7+Math.random()*9)+"s";
    h.style.animationDelay=(-Math.random()*9)+"s";
    box.appendChild(h);
  }
})();

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $("#"+id).classList.add("active");
}
document.querySelectorAll(".back").forEach(b=>b.onclick=()=>show(b.dataset.go));

/* ============================================================
   SCREEN 1 — the playful No button
   ============================================================ */
const yesBtn=$("#yesBtn"), noBtn=$("#noBtn"), askRow=$("#askRow");
const canHover = window.matchMedia("(hover:hover) and (pointer:fine)").matches;
const noLines=["No","Are you sure?","Really sure?","Think again 🙃","Last chance…","You can't 😄","Just say yes 💗"];
let noStage=0, yesScale=1;

function growYes(){ yesScale=Math.min(yesScale+0.18,2.4); yesBtn.style.transform=`scale(${yesScale})`; }

if(canHover){
  // Desktop: the No button flees from the cursor
  noBtn.addEventListener("mouseenter",fleeNo);
  noBtn.addEventListener("click",fleeNo); // in case they're fast
  function fleeNo(){
    noBtn.classList.add("flee");
    const pad=20, w=noBtn.offsetWidth, h=noBtn.offsetHeight;
    const x=pad+Math.random()*(window.innerWidth-w-pad*2);
    const y=pad+Math.random()*(window.innerHeight-h-pad*2);
    noBtn.style.left=x+"px"; noBtn.style.top=y+"px";
    growYes();
  }
}else{
  // Mobile: No shrinks + changes text, Yes grows
  noBtn.addEventListener("click",e=>{
    e.preventDefault();
    noStage++;
    noBtn.textContent = noLines[Math.min(noStage,noLines.length-1)];
    const s=Math.max(1-noStage*0.16,0.25);
    noBtn.style.transform=`scale(${s})`;
    growYes();
    if(noStage>=6){ noBtn.style.pointerEvents="none"; noBtn.style.opacity=.4; }
  });
}
yesBtn.addEventListener("click",()=>{ buildFood(); show("s2"); });

/* ============================================================
   SCREEN 2 — food
   ============================================================ */
const FOODS=[
  ["🍜","Ramen"],["🍰","Dessert"],["🍸","Bar"],["🍣","Sushi"],
  ["🍕","Pizza"],["🍖","BBQ"],["☕","Coffee"],["🎲","Surprise me"]
];
function buildFood(){
  const g=$("#foodGrid"); if(g.children.length) return;
  FOODS.forEach(([ic,lb])=>{
    const c=document.createElement("div"); c.className="card";
    c.innerHTML=`<span class="ic">${ic}</span><span class="lb">${lb}</span>`;
    c.onclick=()=>{
      g.querySelectorAll(".card").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel"); state.food=`${ic} ${lb}`; $("#foodNext").disabled=false;
    };
    g.appendChild(c);
  });
}
$("#foodNext").onclick=()=>{ buildCalendar(); show("s3"); };

/* ============================================================
   SCREEN 3 — calendar (June 2026) + time
   ============================================================ */
const MONTH={year:2026, month:5}; // month is 0-indexed -> 5 = June
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
function buildCalendar(){
  $("#calHead").textContent=`${MONTH_NAMES[MONTH.month]} ${MONTH.year}`;
  const days=$("#days"); if(days.children.length) {} else {
    const first=new Date(MONTH.year,MONTH.month,1);
    // Monday-first offset
    let lead=(first.getDay()+6)%7;
    const total=new Date(MONTH.year,MONTH.month+1,0).getDate();
    const today=new Date(); today.setHours(0,0,0,0);
    for(let i=0;i<lead;i++){ const e=document.createElement("div"); e.className="day empty"; days.appendChild(e); }
    for(let d=1;d<=total;d++){
      const cell=document.createElement("div"); cell.className="day"; cell.textContent=d;
      const cellDate=new Date(MONTH.year,MONTH.month,d);
      if(cellDate<today){ cell.classList.add("off"); }
      else cell.onclick=()=>{
        days.querySelectorAll(".day").forEach(x=>x.classList.remove("sel"));
        cell.classList.add("sel");
        state.dateLabel=`${MONTH_NAMES[MONTH.month]} ${d}, ${MONTH.year}`;
        checkTimeNext();
      };
      days.appendChild(cell);
    }
  }
  const slots=["11:00","12:00","13:00","17:00","18:00","19:00","20:00","21:00"];
  const tc=$("#timeChips");
  if(!tc.children.length){
    slots.forEach(t=>{
      const c=document.createElement("div"); c.className="chip"; c.textContent=t;
      c.onclick=()=>{ tc.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); state.time=t; checkTimeNext(); };
      tc.appendChild(c);
    });
  }
}
function checkTimeNext(){ $("#timeNext").disabled=!(state.dateLabel&&state.time); }
$("#timeNext").onclick=()=>{ buildPlace(); show("s4"); };

/* ============================================================
   SCREEN 4 — place
   ============================================================ */
const PLACES=["Cinema 🎬","Cafe ☕","The Mall 🛍️","Park & walk 🌳","Bowling 🎳","Ice rink ⛸️","Art gallery 🎨","Hotel evening 🌙","Your pick 😉"];
function buildPlace(){
  const pc=$("#placeChips"); if(pc.children.length) return;
  PLACES.forEach(p=>{
    const c=document.createElement("div"); c.className="chip"; c.textContent=p;
    c.onclick=()=>{ pc.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); $("#placeInput").value=p; state.place=p; $("#placeNext").disabled=false; };
    pc.appendChild(c);
  });
}
$("#placeInput").addEventListener("input",e=>{
  state.place=e.target.value.trim();
  $("#placeChips").querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
  $("#placeNext").disabled=state.place.length===0;
});
$("#placeNext").onclick=finish;

/* ============================================================
   SCREEN 5 — confirm + save
   ============================================================ */
function finish(){
  $("#summary").innerHTML=`
    <div>🍴 Food: <b>${state.food||"—"}</b></div>
    <div>📅 Date: <b>${state.dateLabel||"—"}</b></div>
    <div>⏰ Time: <b>${state.time||"—"}</b></div>
    <div>📍 Place: <b>${state.place||"—"}</b></div>
    <div>💌 <b>${CONFIG.yourName}</b> will be there at that moment.</div>`;
  show("s5");
  burst();
  saveAnswer();
}

function saveAnswer(){
  if(!CONFIG.sheetUrl){ $("#status").textContent="(Saving is off — add your Sheet URL in CONFIG to record this.)"; return; }
  $("#status").textContent="Saving your answer… 💾";
  const payload={ food:state.food, date:state.dateLabel, time:state.time, address:state.place };
  fetch(CONFIG.sheetUrl,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  }).then(()=>{ $("#status").textContent="Saved 💖 See you then!"; })
    .catch(()=>{ $("#status").textContent="Couldn't save automatically — but it's still a date! 💕"; });
}

/* confetti / heart burst */
function burst(){
  const set=["💖","💕","🎉","✨","🌸","💗"];
  for(let i=0;i<40;i++){
    const p=document.createElement("span");
    p.textContent=set[i%set.length];
    p.style.position="fixed"; p.style.left="50%"; p.style.top="40%";
    p.style.fontSize=(16+Math.random()*20)+"px"; p.style.zIndex=9; p.style.pointerEvents="none";
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=120+Math.random()*220;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist - 80;
    p.animate(
      [{transform:"translate(-50%,-50%) scale(.4)",opacity:1},
       {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.2)`,opacity:0}],
      {duration:1100+Math.random()*700, easing:"cubic-bezier(.2,.7,.3,1)"}
    ).onfinish=()=>p.remove();
  }
}

/* ============================================================
   Gentle background music — generated live (no audio files).
   Soft pentatonic notes over a warm pad, looping quietly.
   ============================================================ */
const Music = (function(){
  // If a file named in CONFIG.musicFile exists in the folder, we play THAT (the real song).
  // Otherwise we fall back to a gentle synth melody. Drop "song.mp3" next to index.html.
  const FILE = CONFIG.musicFile || "song.mp3";
  const FILE_VOL = 0.35;   // real-song volume (0..1) — keep it soft
  let mode=null;           // "file" | "synth"
  let audio=null;
  let ctx, master, timer, on=false;

  /* ---------- synth fallback ---------- */
  const scale=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
  let idx=0, dir=1;
  function note(freq,t,dur){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle"; o.frequency.value=freq; o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.18,t+0.08);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.start(t); o.stop(t+dur+0.05);
  }
  function pad(freq,t,dur){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=freq; o.connect(g); g.connect(master);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.05,t+0.6);
    g.gain.linearRampToValueAtTime(0.0,t+dur); o.start(t); o.stop(t+dur+0.1);
  }
  function step(){
    const t=ctx.currentTime;
    note(scale[idx],t,1.6);
    if(Math.random()<0.5) note(scale[(idx+2)%scale.length]/2,t+0.4,1.4);
    pad(scale[0]/2,t,2.2);
    idx+=dir; if(idx>=scale.length-1||idx<=0) dir*=-1;
  }
  function startSynth(){
    if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination); }
    if(ctx.state==="suspended") ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.5, ctx.currentTime+1.2);
    step(); clearInterval(timer); timer=setInterval(step,1300);
    mode="synth"; on=true; setBtn();
  }
  function stopSynth(){
    if(!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime+0.6);
    clearInterval(timer);
  }

  /* ---------- real-song file ---------- */
  function fadeAudio(to){
    if(!audio) return; const from=audio.volume, t0=performance.now(), dur=900;
    (function tick(){ const k=Math.min((performance.now()-t0)/dur,1);
      audio.volume=from+(to-from)*k; if(k<1) requestAnimationFrame(tick); })();
  }
  function startFile(){
    if(!audio){
      audio=new Audio(FILE); audio.loop=true; audio.volume=0;
      audio.addEventListener("error",()=>{ stat("song.mp3 error → melody"); if(mode!=="synth") startSynth(); });
    }
    audio.play().then(()=>{ mode="file"; on=true; fadeAudio(FILE_VOL); setBtn(); stat("♪ playing song"); })
                .catch(err=>{ stat("song blocked → melody ("+(err&&err.name)+")"); startSynth(); });
  }
  function stat(m){ var el=document.getElementById("mstat"); if(el) el.textContent=m; }

  /* ---------- public ---------- */
  function play(){
    // Unlock the audio context synchronously inside the click, so the synth
    // fallback can still make sound even if the file's play() promise rejects later.
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);}catch(e){} }
    if(ctx&&ctx.state==="suspended") ctx.resume();
    if(mode==="synth"){ startSynth(); return; }
    startFile(); // try the real song; auto-fallback to synth melody
  }
  function pause(){
    on=false;
    if(mode==="file"&&audio){ fadeAudio(0); setTimeout(()=>{ if(!on&&audio) audio.pause(); },950); }
    else stopSynth();
    setBtn();
  }
  function toggle(){ on?pause():play(); }
  function setBtn(){ document.getElementById("muteBtn").textContent = on ? "🔊" : "🔇"; }
  return { play, toggle, isOn:()=>on };
})();

const muteBtn=document.getElementById("muteBtn");
muteBtn.addEventListener("click",e=>{ e.stopPropagation(); Music.toggle(); muteBtn.classList.remove("hint"); });

// Music ON by default: browsers block sound until the first touch/click, so we
// start it on the very first interaction anywhere on the page.
function firstGesture(){
  if(!Music.isOn()) Music.play();
  ["pointerdown","touchstart","click","keydown"].forEach(ev=>window.removeEventListener(ev,firstGesture,true));
}
["pointerdown","touchstart","click","keydown"].forEach(ev=>window.addEventListener(ev,firstGesture,true));
</script>
</body>
